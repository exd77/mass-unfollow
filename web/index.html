<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Unfollow - X/Twitter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐦 Mass Unfollow</h1>
            <p class="subtitle">Find and unfollow inactive X/Twitter accounts</p>
        </header>

        <!-- Login Form -->
        <section id="login-section" class="card">
            <h2>🔐 Login</h2>
            <p class="help-text">Get credentials from x.com cookies (F12 → Application → Cookies)</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="auth_token">Auth Token</label>
                    <input type="text" id="auth_token" placeholder="auth_token from x.com cookies" required>
                </div>
                
                <div class="form-group">
                    <label for="ct0">CT0 (CSRF Token)</label>
                    <input type="text" id="ct0" placeholder="ct0 from x.com cookies" required>
                </div>
                
                <div class="form-group">
                    <label for="user_id">User ID</label>
                    <input type="text" id="user_id" placeholder="From twid cookie (u%3D12345 → 12345)" required>
                </div>
                
                <div class="form-group">
                    <label for="days_threshold">Inactivity Threshold (days)</label>
                    <select id="days_threshold">
                        <option value="30">30 days</option>
                        <option value="90" selected>90 days</option>
                        <option value="180">180 days</option>
                        <option value="365">1 year</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Connect & Fetch</button>
            </form>
        </section>

        <!-- Progress Section -->
        <section id="progress-section" class="card" style="display: none;">
            <h2>📊 <span id="progress-title">Loading...</span></h2>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <p id="progress-text" class="progress-text">0%</p>
            <p id="progress-detail" class="progress-detail"></p>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="card" style="display: none;">
            <h2>📊 Results</h2>
            
            <div class="stats-row">
                <div class="stat">
                    <span class="stat-value" id="stat-following">0</span>
                    <span class="stat-label">Following</span>
                </div>
                <div class="stat">
                    <span class="stat-value stat-warning" id="stat-inactive">0</span>
                    <span class="stat-label">Inactive</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="stat-active">0</span>
                    <span class="stat-label">Active</span>
                </div>
            </div>
            
            <div class="tabs">
                <button class="tab active" data-tab="all">All</button>
                <button class="tab" data-tab="inactive">Inactive</button>
                <button class="tab" data-tab="active">Active</button>
            </div>
            
            <div class="filter-row">
                <label>Filter:</label>
                <select id="filter-threshold">
                    <option value="30">> 30 days</option>
                    <option value="90" selected>> 90 days</option>
                    <option value="180">> 180 days</option>
                    <option value="365">> 365 days</option>
                </select>
                <button id="btn-select-all" class="btn btn-small">Select All</button>
                <button id="btn-deselect-all" class="btn btn-small">Deselect All</button>
            </div>
            
            <div id="user-list" class="user-list"></div>
            
            <div class="action-row">
                <button id="btn-unfollow" class="btn btn-danger">
                    Unfollow Selected (<span id="selected-count">0</span>)
                </button>
            </div>
        </section>

        <!-- Unfollow Progress -->
        <section id="unfollow-section" class="card" style="display: none;">
            <h2>🚀 Unfollowing...</h2>
            <div class="progress-bar">
                <div id="unfollow-progress-fill" class="progress-fill progress-fill-danger"></div>
            </div>
            <p id="unfollow-progress-text" class="progress-text">0%</p>
            <p id="unfollow-progress-detail" class="progress-detail"></p>
        </section>

        <!-- Done Section -->
        <section id="done-section" class="card" style="display: none;">
            <h2>✅ Complete!</h2>
            <div class="stats-row">
                <div class="stat">
                    <span class="stat-value stat-success" id="result-success">0</span>
                    <span class="stat-label">Unfollowed</span>
                </div>
                <div class="stat">
                    <span class="stat-value stat-danger" id="result-failed">0</span>
                    <span class="stat-label">Failed</span>
                </div>
            </div>
            <button id="btn-start-over" class="btn btn-primary">Start Over</button>
        </section>
    </div>

    <footer>
        <p>Built with Twikit • <a href="https://github.com/exd77/mass-unfollow">GitHub</a></p>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
